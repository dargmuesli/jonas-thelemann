allowBuilds:
  '@dargmuesli/nuxt-vio': false
  '@parcel/watcher': false
  '@sentry/cli': false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false
minimumReleaseAgeExclude:
  - '@dargmuesli/nuxt-vio-testing@21.0.16 || 23.0.0-beta.3 || 23.0.0-beta.4 || 23.0.0-beta.6 || 23.0.0-beta.7 || 23.1.2 || 23.1.3'
  - '@dargmuesli/nuxt-vio@21.0.16 || 23.0.0-beta.3 || 23.0.0-beta.4 || 23.0.0-beta.6 || 23.0.0-beta.7 || 23.0.0-beta.8 || 23.1.2 || 23.1.3'
  - '@nuxt/kit@4.5.1'
  - '@nuxt/nitro-server@4.5.1'
  - '@nuxt/schema@4.5.1'
  - '@nuxt/vite-builder@4.5.1'
  - nuxt-schema-org@7.0.1
  - nuxt@4.5.1
overrides:
  # Keep a single @takumi-rs/core version so the og-image renderer's
  # core@2.16.3 is not paired with a deduped helpers@2.17.0 (which dropped
  # the `prepareRenderInput` export and crashes the node server at runtime).
  '@takumi-rs/core': 2.16.3
packages:
  - src
  - tests
